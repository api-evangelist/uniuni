apis:
- name: UniUni Partner API
  description: >-
    JWT-authenticated API for partner vendors (drop-off locations, scan events) to exchange an API key
    for a 24-hour access token and query shipment tracking status and event history.
  humanURL: https://help.ship.uniuni.com/en/partner-api/must-read
  baseURL: https://api.ship.uniuni.com/partner
  tags:
  - Tracking
  - Partners
  properties:
  - type: Documentation
    url: https://help.ship.uniuni.com/en/partner-api/authentication
- name: UniUni Integration API
  description: >-
    Legacy enterprise integration API documented as a public Postman collection — token-based authorization,
    freight estimation, sorting information, batch management, shipment creation/cancellation, label printing,
    service availability validation, tracking queries, push-tracking webhooks with HMAC, and proof-of-delivery
    retrieval.
  humanURL: https://docs.uniuni.com/
  baseURL: https://prm-api.uniuni.com
  tags:
  - Shipments
  - Tracking
  - Labels
  properties:
  - type: Documentation
    url: https://docs.uniuni.com/
- aid: uniuni:uniuni-batches-api
