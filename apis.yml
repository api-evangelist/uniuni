aid: uniuni
name: UniUni
description: >-
  UniUni is a Canadian last-mile delivery carrier serving ecommerce businesses across Canada and
  the United States, delivering parcels through a crowdsourced driver network with hubs, stores,
  and partner drop-off locations. The UniUni Platform gives merchants shipment creation, label
  purchase, batching, wallet billing, tracking, and Shopify/ShipStation/WooCommerce
  integrations, alongside a REST Client API, a Partner API for vendor tracking updates, and a
  legacy Integration API for enterprise shippers.
