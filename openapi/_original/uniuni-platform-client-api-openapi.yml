      security: []
components:
  schemas:
    BatchShipmentsRequest:
      type: object
      properties:
        shipments:
          type: array
          items:
            type: string
          description: List of order numbers.
      required:
      - shipments
    BatchMutationResponseData:
      type: object
      description: Partial batch summary returned after add/remove shipment operations.
      properties:
        batchNumber:
          type: string
        batchName:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - PICKUP_REQUESTED
          - PICKUP_CANCELLED
          - PARTNER_RECEIVED
          - PICKED_UP
          - RECEIVED
          description: Batch status.
        printedLabel:
          type: boolean
        shipmentCount:
          type: integer
      required:
      - batchNumber
      - status
      - printedLabel
      - shipmentCount
    CreateBatchRequest:
      type: object
      properties:
        batchName:
          type: string
          description: Name for the batch.
        shipments:
          type: array
          items:
            type: string
          description: List of order numbers to include. Only purchased shipments can be added.
    Batch:
      type: object
      properties:
        batchNumber:
          type: string
          description: Unique batch identifier.
        batchName:
          type: string
          description: Batch name.
        status:
          type: string
          enum:
          - PENDING
          - PICKUP_REQUESTED
          - PICKUP_CANCELLED
          - PARTNER_RECEIVED
          - PICKED_UP
          - RECEIVED
          description: Batch status.
        printedLabel:
          type: boolean
          description: Whether the batch label has been printed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shipmentCount:
          type: integer
          description: Number of shipments in the batch.
        shipments:
          type: array
          items:
            type: string
          description: List of shipment order numbers.
    ListBatchesResponseData:
      type: object
      properties:
        batches:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - batches
      - pagination
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        count:
          type: integer
          description: Total number of records.
    BatchResponseData:
      type: object
      properties:
        batchNumber:
          type: string
          description: Unique batch identifier.
        batchName:
          type: string
          description: Batch name.
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - PICKUP_REQUESTED
          - PICKUP_CANCELLED
          - PARTNER_RECEIVED
          - PICKED_UP
          - RECEIVED
          description: Batch status.
        printedLabel:
          type: boolean
          description: Whether the batch label has been printed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shipmentCount:
          type: integer
          description: Number of shipments in the batch.
        shipments:
          type: array
          items:
            type: string
          description: List of shipment order numbers.
      required:
      - batchNumber
      - status
      - printedLabel
      - shipmentCount
    LabelResponseData:
      type: object
      properties:
        headers:
          type: object
          properties:
            Content-Type:
              type: string
              example: application/pdf
            Content-Disposition:
              type: string
              example: attachment; filename="label.pdf"
          required:
          - Content-Type
          - Content-Disposition
        body:
          type: string
          description: Base64-encoded PDF content.
      required:
      - headers
      - body
    CreateShipmentRequest:
      type: object
      properties:
        recipient:
          $ref: '#/components/schemas/Recipient'
          description: Recipient details. Provide phone, email, or both.
        address:
          $ref: '#/components/schemas/Address'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
          description: Package dimensions. Provide either dimensions or packagingId, not both. If neither
            is provided, a saved default packaging preset will be used. If there are no saved packaging
            presets, dimensions are required.
        packagingId:
          type: integer
          description: ID of a pre-configured packaging profile. Use instead of dimensions if the package
            matches a saved profile.
        weight:
          $ref: '#/components/schemas/Weight'
        postageType:
          $ref: '#/components/schemas/PostageType'
        note:
          type: string
          maxLength: 200
          description: Optional note, up to 200 characters.
        insuranceRequired:
          type: boolean
          description: Whether parcel protection (insurance) is required for this shipment.
        shipmentLineItems:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLineItem'
          minItems: 1
          description: Line items describing the contents. Must contain at least one item.
        orderNumber:
          type: string
          description: Optional client-provided order reference.
      required:
      - recipient
      - address
      - weight
      - shipmentLineItems
      - postageType
    ShipmentResponseData:
      type: object
      properties:
        orderNumber:
          type: string
          description: Unique order number.
        trackingId:
          type: string
          description: Shipment tracking ID.
        recipient:
          $ref: '#/components/schemas/Recipient'
        address:
          $ref: '#/components/schemas/Address'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        weight:
          $ref: '#/components/schemas/Weight'
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rates:
          $ref: '#/components/schemas/BillingSummary'
        shipmentLineItems:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLineItem'
        insuranceRequired:
          type: boolean
      required:
      - orderNumber
      - trackingId
      - status
      - createdAt
    Recipient:
      type: object
      properties:
        name:
          type: string
          description: Recipient name.
        phone:
          type: string
          description: Recipient phone number.
        email:
          type: string
          format: email
          description: Recipient email.
        signature:
          type: boolean
          default: false
          description: Whether signature is required on delivery.
      required:
      - name
    Address:
      type: object
      properties:
        address1:
          type: string
          description: Address line 1.
        address2:
          type: string
          description: Address line 2.
        address3:
          type: string
          description: Address line 3.
        city:
          type: string
          description: City.
        province:
          type: string
          description: Province or state code.
        postalCode:
          type: string
          description: Postal or ZIP code.
        country:
          type: string
          description: Country code (e.g. CA, US).
        latitude:
          type: number
          description: Latitude.
        longitude:
          type: number
          description: Longitude.
      required:
      - address1
      - city
      - province
      - postalCode
      - country
    Dimensions:
      type: object
      properties:
        length:
          type: number
          description: Length.
        width:
          type: number
          description: Width.
        height:
          type: number
          description: Height.
        dimensionUnit:
          type: string
          enum:
          - CM
          - INCH
          - M
          - FT
          description: Unit of dimension.
    Weight:
      type: object
      properties:
        value:
          type: number
          description: Weight value.
        weightUnit:
          type: string
          enum:
          - G
          - KG
          - LB
          - OZ
          description: Unit of weight.
      required:
      - value
      - weightUnit
    PostageType:
      type: string
      enum:
      - PUBLICATION
      - SAME DAY
      - NEXT DAY
      - STANDARD
      - USPS Ground Advantage
      - PostNL International Packet Tracked
      - OTHER
      description: Preferred postage type. Domestic shipments typically use SAME DAY, NEXT DAY, or STANDARD.
        Cross-border CA→US shipments use USPS Ground Advantage (DDP) or PostNL International Packet Tracked
        (DDU). If the requested type is unavailable, an available type is selected automatically.
    ShipmentLineItem:
      type: object
      properties:
        description:
          type: string
          description: Item description.
        quantity:
          type: integer
          description: Quantity (must be a positive integer).
        unit_value:
          type: number
          description: Value per unit. Accepted as unit_value (snake_case) or unitValue (camelCase).
        currency:
          type: string
          enum:
          - CAD
          - USD
          description: Currency code.
        hs_code:
          type: string
          description: HS tariff code for cross-border shipments. Accepted as hs_code or hsCode.
        country_of_origin:
          type: string
          description: ISO country code of manufacture. Accepted as country_of_origin or countryOfOrigin.
        sku:
          type: string
          description: Your internal SKU reference.
        manufacturer:
          type: object
          description: Manufacturer details. Required for some cross-border shipments.
          properties:
            name:
              type: string
              description: Manufacturer name (min 3 characters).
            address1:
              type: string
              description: Street address.
            address2:
              type: string
              description: Address line 2.
            city:
              type: string
              description: City.
            provinceCode:
              type: string
              description: Province or state code.
            postalCode:
              type: string
              description: Postal or ZIP code.
            countryCode:
              type: string
              description: ISO 3166-1 alpha-2 country code (e.g. CN, US, CA).
            phone:
              type: string
              description: Manufacturer phone number.
            email:
              type: string
              format: email
              description: Manufacturer email address.
          required:
          - name
          - address1
          - city
          - countryCode
      required:
      - description
      - quantity
      - unit_value
      - currency
    ShipmentStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - PENDING_REVIEW
      - PICKUP_REQUESTED
      - PICKUP_CANCELLED
      - PARTNER_RECEIVED
      - PICKED_UP
      - RECEIVED
      - GATEWAY_TRANSIT
      - PARCEL_SCANNED
      - TRANSSHIPMENT_COMPLETE
      - IN_TRANSIT
      - OUT_FOR_DELIVERY
      - DELIVERED
      - SHIPMENT_EXCEPTION
      - AGED_OUT
      - RETURNED
      - CANCELLED
      - STORAGE
      - FAILED
      - FAILED_DELIVERY1
      - FAILED_DELIVERY2
      - GATEWAY_TO_GATEWAY_TRANSIT
      - GATEWAY_TRANSIT_OUT
      description: Shipment status.
    BillingSummary:
      type: object
      properties:
        postageType:
          $ref: '#/components/schemas/PostageType'
        postageFee:
          type: number
          description: Postage fee.
        signatureFee:
          type: number
          description: Signature fee.
        duty:
          type: number
          description: Duty amount (cross-border shipments only).
        tax:
          type: number
          description: Tax amount.
        total:
          type: number
          description: Total cost.
        currency:
          type: string
          enum:
          - CAD
          - USD
          description: Currency code.
    ListShipmentsResponseData:
      type: object
      properties:
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentResponseData'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - shipments
      - pagination
    PricingQuoteRequest:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
          description: Package dimensions. Provide either dimensions or packagingId, not both. If neither
            is provided, a saved default packaging preset will be used. If there are no saved packaging
            presets, dimensions are required.
        packagingId:
          type: number
          description: ID of a pre-configured packaging profile. Use instead of dimensions if the package
            matches a saved profile.
        weight:
          $ref: '#/components/schemas/Weight'
        postageType:
          type: string
          enum:
          - STANDARD
          - USPS Ground Advantage
          - PostNL International Packet Tracked
          description: Requested postage service. STANDARD is for domestic. USPS Ground Advantage is for
            CA to US cross-border (DDP, merchant pays duties). PostNL International Packet Tracked is
            for CA to US cross-border (DDU, recipient pays duties). If the requested type is unavailable,
            an available type is selected automatically.
      required:
      - address
      - weight
      - postageType
    PricingQuoteResponseData:
      type: object
      properties:
        rates:
          type: array
          items:
            $ref: '#/components/schemas/Rate'
          description: List of estimated rates. May be empty if no service is available for the given
            inputs.
        carrierName:
          type: string
        estimated:
          type: boolean
        disclaimer:
          type: string
      required:
      - rates
      - carrierName
      - estimated
      - disclaimer
    Rate:
      type: object
      properties:
        postageType:
          type: string
        carrierName:
          type: string
        postageFee:
          type: number
        tax:
          type: number
        total:
          type: number
        currency:
          type: string
          description: Always returned as CAD, including cross-border CA to US routes.
        estimated:
          type: boolean
        minDeliveryDays:
          type: number
        maxDeliveryDays:
          type: number
      required:
      - postageType
      - carrierName
      - postageFee
      - tax
      - total
      - currency
      - estimated
      - minDeliveryDays
      - maxDeliveryDays
    PurchaseShipmentResponseData:
      type: object
      properties:
        trackingId:
          type: string
          description: Shipment tracking ID.
        orderNumber:
          type: string
          description: Order number.
        insuranceCreated:
          type: boolean
          description: Whether parcel protection was created.
      required:
      - trackingId
      - orderNumber
    RetrieveShipmentResponseData:
      type: object
      properties:
        shipment:
          $ref: '#/components/schemas/ShipmentResponseData'
      required:
      - shipment
    TrackingResponseData:
      type: object
      properties:
        trackingId:
          type: string
          description: Shipment tracking ID.
        status:
          type: string
          description: Current shipment status.
        statusCode:
          type: integer
          description: Internal status code.
        orderNumber:
          type: string
          description: Order number.
        labelCreatedAt:
          type: integer
          description: Unix timestamp (ms) when label was created.
        recipient:
          type: object
          properties:
            fullName:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
          required:
          - fullName
        destination:
          $ref: '#/components/schemas/Address'
        batchId:
          type: string
        note:
          type: string
        signatureRequired:
          type: boolean
        weight:
          $ref: '#/components/schemas/Weight'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEvent'
      required:
      - trackingId
      - status
      - orderNumber
    TrackingEvent:
      type: object
      properties:
        status:
          type: string
          description: Shipment status string at time of event (e.g. `OUT_FOR_DELIVERY`, `DELIVERED`).
        statusCode:
          type: integer
          description: Numeric status code corresponding to the status.
        timestamp:
          type: integer
          description: Unix timestamp in milliseconds.
        location:
          type: object
          properties:
            name:
              type: string
              description: Location name.
            lat:
              type: number
              description: Latitude.
            lng:
              type: number
              description: Longitude.
        description:
          type: string
          description: Additional notes about the event.
    WebhookPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - shipment.status_updated
          - shipment.custom_event
          description: Webhook event type.
        version:
          type: string
          description: Schema version of the webhook payload.
        data:
          type: object
          properties:
            objectType:
              type: string
              enum:
              - Shipment
              description: Object type discriminator.
            trackingId:
              type: string
              description: Shipment tracking ID.
            status:
              type: string
              description: New shipment status.
            statusCode:
              type: integer
              description: Internal status code.
            updatedAt:
              type: string
              format: date-time
            address:
              $ref: '#/components/schemas/Address'
            transferCarrierName:
              type: string
              description: Name of the transfer carrier when package is handed off.
            transferCarrierTrackingId:
              type: string
              description: Tracking ID assigned by the transfer carrier.
            proofOfDelivery:
              type: object
              description: Included when status is DELIVERED.
              properties:
                recipient:
                  type: string
                  description: Name of person who received the parcel.
                deliveryDate:
                  type: string
                  format: date
                  description: YYYY-MM-DD.
                deliveryTime:
                  type: string
                  description: HH:mm:ss.
                trackingNumber:
                  type: string
                  description: Tracking number used for proof of delivery.
                pods:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Proof of delivery image URLs.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API access token generated from the UniUni Platform dashboard.
