name: UniUni Platform sandbox
summary: >-
  The UniUni Platform Client API ships a fully isolated sandbox environment. Integrations are
  tested against the sandbox base URL with no charges incurred; sandbox data is isolated from
  production and can be reset. Sandbox accounts are created on a separate portal host and use
  their own API access tokens.
environments:
  - name: sandbox
    base_url: https://api-sandbox.ship.uniuni.com/client/
    portal: https://sandbox.unigo.ca/integrations/rest-api
    notes: No charges incurred. Sandbox data is isolated and can be reset without affecting production.
  - name: production
    base_url: https://api.ship.uniuni.com/prod/client/
    portal: https://ship.uniuni.com/integrations/rest-api
test_values:
  - kind: credit_card
    value: '4242 4242 4242 4242'
    notes: >-
      Published sandbox test card for adding wallet test credits — use any expiry and CVC
      (documented on the API introduction page).
token_model:
  notes: >-
    Sandbox and production tokens are generated separately from each environment's REST API
    integration page; up to 5 active tokens per environment.
